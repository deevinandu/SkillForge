[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.0.1"
description = "CI/CD for robot behaviors: agents write, harden and learn robot skills, sim to real."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]
agents = ["anthropic>=0.40", "claude-agent-sdk"]
learning = ["torch>=2.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731"]
